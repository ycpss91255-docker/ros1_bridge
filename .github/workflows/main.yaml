name: Main CI/CD

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# `call-release` (template's release-worker.yaml) uses
# softprops/action-gh-release@v2, which needs `contents: write` to
# create a GitHub Release. Reusable workflow permissions intersect
# with the caller's, so granting here is required — GitHub Actions
# default is read-only.
permissions:
  contents: write

jobs:
  call-docker-build:
    # Matrix across ROS 2 distros — Noetic source-built into both
    # humble (jammy) and jazzy (noble) targets per issue #53. Each
    # distro is built and pushed under its own image_name to keep
    # registry tags unambiguous (e.g. ros1_bridge-jazzy:devel).
    strategy:
      fail-fast: false
      matrix:
        ros2_distro: [humble, jazzy]
    uses: ycpss91255-docker/template/.github/workflows/build-worker.yaml@v0.23.0
    with:
      image_name: ros1_bridge-${{ matrix.ros2_distro }}
      build_runtime: true
      platforms: linux/amd64,linux/arm64
      test_tools_version: v0.20.1
      # No `BRIDGE_FILE=` override here — CI runs with no `bridge.yaml`
      # symlink in the context, exercising the Dockerfile-internal fallback
      # to `config/demo_bridge.yaml` (closes #65). This also keeps the
      # fallback path under continuous regression coverage.
      build_args: |
        ROS2_DISTRO=${{ matrix.ros2_distro }}
        RUNTIME_SMOKE_CMD=bash -c '. /opt/ros/install/setup.bash && command -v ros1_bridge'

  # Stable umbrella check that aggregates the matrix shards into a single
  # status name. Branch protection requires only `ci-summary` so adding
  # a new ROS 2 distro to the matrix above does not require updating the
  # protection rule each time. Marked `if: always()` so the job runs even
  # when shards fail, and asserts every dependency was a success.
  ci-summary:
    needs: call-docker-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all matrix shards succeeded
        env:
          RESULT: ${{ needs.call-docker-build.result }}
        run: |
          echo "call-docker-build result: ${RESULT}"
          test "${RESULT}" = "success"

  call-release:
    needs: call-docker-build
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        ros2_distro: [humble, jazzy]
    uses: ycpss91255-docker/template/.github/workflows/release-worker.yaml@v0.23.0
    with:
      archive_name_prefix: ros1_bridge-${{ matrix.ros2_distro }}
