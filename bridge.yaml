# parameter_bridge default configuration.
#
# Loaded into the ROS 1 parameter server by /entrypoint.sh
# (rosparam load /bridge.yaml) and consumed by `ros2 run ros1_bridge
# parameter_bridge`. Schema reference (foxy branch):
# https://github.com/ros2/ros1_bridge/blob/foxy/src/parameter_bridge.cpp
#
# Three top-level keys are supported:
#   topics            - bidirectional topic bridges
#   services_1_to_2   - expose a ROS 1 service to ROS 2 clients
#   services_2_to_1   - expose a ROS 2 service to ROS 1 clients
#
# Note the intentional asymmetry in the `type` field:
#   - topic   type uses the ROS 2 form: <package>/msg/<MsgName>
#   - service type uses the ROS 1 form: <package>/<SrvName>
# The deprecated `package:` key for services is ignored here; always
# encode the package into the `type` string directly.

# ---------------------------------------------------------------------------
# Topics
# ---------------------------------------------------------------------------
# Each entry:
#   topic       (required) ROS name, e.g. /scan
#   type        (required) ROS 2 msg type, e.g. sensor_msgs/msg/LaserScan
#   queue_size  (optional) ROS 1 subscriber queue, default 100
#   qos         (optional) ROS 2 publisher QoS override; when omitted the
#               bridge uses KeepLast(10) with default RMW reliability /
#               durability. Sub-keys:
#                 history                    keep_all | keep_last
#                 depth                      int, required when history=keep_last
#                 reliability                best_effort | reliable
#                 durability                 volatile | transient_local
#                 deadline                   {secs, nsecs}
#                 lifespan                   {secs, nsecs}
#                 liveliness                 LIVELINESS_SYSTEM_DEFAULT |
#                                            LIVELINESS_AUTOMATIC |
#                                            LIVELINESS_MANUAL_BY_TOPIC
#                 liveliness_lease_duration  {secs, nsecs}
topics:
  - topic: /scan
    type: sensor_msgs/msg/LaserScan
    queue_size: 10
    # Sensor-data style QoS: prefer freshness over delivery guarantees.
    qos:
      history: keep_last
      depth: 5
      reliability: best_effort
      durability: volatile

# ---------------------------------------------------------------------------
# Services: ROS 1 -> ROS 2 (a ROS 1 service becomes callable from ROS 2)
# ---------------------------------------------------------------------------
# Each entry:
#   service  (required) ROS name, e.g. /add_two_ints
#   type     (required) ROS 1 srv type: <package>/<SrvName>
#            (do NOT use <package>/srv/<SrvName>, and do NOT use the
#             deprecated `package:` key)
services_1_to_2:
  - service: /add_two_ints
    type: example_interfaces/AddTwoInts
  - service: /static_map
    type: nav_msgs/GetMap

# ---------------------------------------------------------------------------
# Services: ROS 2 -> ROS 1 (a ROS 2 service becomes callable from ROS 1)
# ---------------------------------------------------------------------------
# Same schema as services_1_to_2.
services_2_to_1:
  - service: /get_parameters
    type: rcl_interfaces/GetParameters
