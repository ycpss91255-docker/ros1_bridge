services:
  # ── Devel ──────────────────────────────────────────────────
  devel:
    build:
      context: .
      dockerfile: Dockerfile
      target: devel
    image: ${DOCKER_HUB_USER:-local}/ros1_bridge:devel
    container_name: ros1_bridge
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true

  # ── Smoke test (ephemeral) ─────────────────────────────────
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    image: ${DOCKER_HUB_USER:-local}/ros1_bridge:test
    profiles:
      - test
