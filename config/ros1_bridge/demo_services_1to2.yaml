# Demo: ROS 1 -> ROS 2 service bridge.
#
# Exposes ROS 1 services to ROS 2 clients via parameter_bridge.
# Schema reference (foxy branch):
# https://github.com/ros2/ros1_bridge/blob/foxy/src/parameter_bridge.cpp
#
# NOTE: type conversions for the services below must be compiled into
# the ros1_bridge binary; the stock foxy build does not include
# `example_interfaces` or `nav_msgs/GetMap`. Expect "no conversion for
# type ..." errors at runtime unless the image was rebuilt with the
# matching ROS 1 / ROS 2 packages installed before `colcon build`.
#
# Activate (creates ./bridge.yaml -> this file):
#   ln -sf config/demo_services_1to2.yaml bridge.yaml

services_1_to_2:
  - service: /add_two_ints
    type: example_interfaces/AddTwoInts
  - service: /static_map
    type: nav_msgs/GetMap
