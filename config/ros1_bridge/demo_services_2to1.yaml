# Demo: ROS 2 -> ROS 1 service bridge.
#
# Exposes ROS 2 services to ROS 1 clients via parameter_bridge.
# Schema reference (foxy branch):
# https://github.com/ros2/ros1_bridge/blob/foxy/src/parameter_bridge.cpp
#
# NOTE: `rcl_interfaces/GetParameters` is the standard parameter service
# every ROS 2 node exposes, but its type conversion is not compiled
# into the stock foxy ros1_bridge build. Expect "no conversion for
# type ..." errors at runtime unless the image was rebuilt with
# matching support.
#
# Activate (creates ./bridge.yaml -> this file):
#   ln -sf config/demo_services_2to1.yaml bridge.yaml

services_2_to_1:
  - service: /get_parameters
    type: rcl_interfaces/GetParameters
