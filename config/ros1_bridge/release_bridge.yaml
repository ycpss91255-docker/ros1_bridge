# RealSense camera bridge configuration.
#
# Bridges the six topics that a typical `realsense2_camera` launch
# publishes (aligned-depth / color / depth, each with image + camera_info).
#
# QoS rationale (aligned with REP-2003 / common sensor_msgs practice):
#   image_raw / image_rect_raw -> BEST_EFFORT, VOLATILE  (high-rate, lossy OK)
#   camera_info                -> RELIABLE, VOLATILE     (low-rate, must match)
# Depth of 5 keeps the queue small so ROS 2 subscribers always see fresh
# frames rather than a backlog after a temporary stall.
topics:
  - topic: /camera/camera/aligned_depth_to_color/camera_info
    type: sensor_msgs/msg/CameraInfo
    queue_size: 10
    qos:
      history: keep_last
      depth: 5
      reliability: reliable
      durability: volatile
  - topic: /camera/camera/aligned_depth_to_color/image_raw
    type: sensor_msgs/msg/Image
    queue_size: 10
    qos:
      history: keep_last
      depth: 5
      reliability: best_effort
      durability: volatile
  - topic: /camera/camera/color/camera_info
    type: sensor_msgs/msg/CameraInfo
    queue_size: 10
    qos:
      history: keep_last
      depth: 5
      reliability: reliable
      durability: volatile
  - topic: /camera/camera/color/image_raw
    type: sensor_msgs/msg/Image
    queue_size: 10
    qos:
      history: keep_last
      depth: 5
      reliability: best_effort
      durability: volatile
  - topic: /camera/camera/depth/camera_info
    type: sensor_msgs/msg/CameraInfo
    queue_size: 10
    qos:
      history: keep_last
      depth: 5
      reliability: reliable
      durability: volatile
  - topic: /camera/camera/depth/image_rect_raw
    type: sensor_msgs/msg/Image
    queue_size: 10
    qos:
      history: keep_last
      depth: 5
      reliability: best_effort
      durability: volatile
