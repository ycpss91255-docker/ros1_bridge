# LaserScan-focused bridge configuration.
#
# Bridges a single /scan topic with a sensor-data style QoS profile so
# that ROS 2 subscribers using the `rclcpp::SensorDataQoS()` profile can
# match the publisher created by the bridge. See parameter_bridge schema:
# https://github.com/ros2/ros1_bridge/blob/foxy/src/parameter_bridge.cpp
topics:
  - topic: /scan
    type: sensor_msgs/msg/LaserScan
    queue_size: 10
    qos:
      history: keep_last
      depth: 5
      reliability: best_effort
      durability: volatile
